name: StudyOps Agent Evaluation & CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  evaluate-and-test:
    name: Run Offline Golden Dataset & AgentOps Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute automated evaluation suite against golden dataset
        env:
          NIHONGO_AGENT_FORCE_OFFLINE: "true"
        run: |
          pytest -v
